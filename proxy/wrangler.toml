name = "feed-focus-proxy"
main = "worker.js"
compatibility_date = "2024-11-01"

# Created with: wrangler kv namespace create FEED_FOCUS_KV
# Paste the printed id below.
kv_namespaces = [
  { binding = "FEED_FOCUS_KV", id = "5290c49280054251be6586531a4932b1" }
]

[vars]
ARK_MODEL = "doubao-seed-2-0-mini-260428"
ARK_BASE_URL = "https://ark.cn-beijing.volces.com/api/v3"
# Daily caps. 1 unit = 1 video classified.
# Global is the hard budget ceiling that bounds your free-token spend.
DEVICE_DAILY_LIMIT = "1000"
IP_DAILY_LIMIT = "2000"
GLOBAL_DAILY_LIMIT = "20000"
MAX_ITEMS = "20"

# ARK_API_KEY is a SECRET — never put it here. Set it with:
#   wrangler secret put ARK_API_KEY
